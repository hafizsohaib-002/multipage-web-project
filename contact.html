<section class="container py-5">
    <h1 class="text-center mb-4">CONTACT US</h1>

    <div class="row justify-content-center">
        <div class="col-md-7">
            <form id="contactForm">
                <input class="form-control mb-3" type="text" placeholder="Your Name" required>
                <input class="form-control mb-3" type="email" placeholder="Your Email" required>
                <input class="form-control mb-3" type="text" placeholder="Subject" required>
                <textarea class="form-control mb-3" rows="5" placeholder="Your Message" required></textarea>

                <button class="btn btn-gold w-100" type="submit">SEND MESSAGE</button>
                <p id="formMessage" class="text-center mt-3"></p>
            </form>
        </div>
    </div>
